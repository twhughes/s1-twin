name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system MIDI libs (python-rtmidi build dep)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libportaudio2
      - name: Install package
        run: pip install -e ".[studio,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
