<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Views harness</title>
<!-- W-match's standalone harness: mounts views/match.js and views/sequencer.js with views/_fakectx.js,
     before the shell (W-plate) exists. The lead deletes this file and _fakectx.js at integration.
     Server mode: http://127.0.0.1:<port>/views/_harness.html#match   Static mode: add ?static -->
<link rel="icon" href="../design/favicon.svg">
<link rel="stylesheet" href="../design/tokens.css">
<style>
  .hx-top { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px 36px; flex-wrap: wrap;
    max-width: 1480px; margin: 0 auto; padding: 22px var(--gutter) 0; }
  .hx-brand { display: flex; align-items: center; gap: 10px; }
  .hx-brand img { width: 32px; height: 32px; }
  .hx-brand span { font: italic 400 30px/1 var(--serif); padding-bottom: 3px; }
  .hx-nav { display: flex; gap: 24px; }
  .hx-nav a { color: var(--ink-2); text-decoration: none; font-size: 14.5px; padding: 5px 0; border-bottom: 1.5px solid transparent; }
  .hx-nav a:hover { color: var(--ink); }
  .hx-nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .hx-meta { margin-left: auto; color: var(--ink-2); font-size: 12.5px; }
  .hx-meta a { color: var(--ink-2); }
  @media (max-width: 640px) { .hx-meta { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<header class="hx-top">
  <div class="hx-brand"><img src="../design/mark.svg" alt=""><span id="hx-name"></span></div>
  <nav class="hx-nav" aria-label="Views"><a href="#sequencer">Sequencer</a><a href="#match">Match</a></nav>
  <span class="hx-meta" id="hx-meta"></span>
</header>
<main id="hx-root"></main>
<div class="toast" id="hx-toast" role="status" aria-live="polite"></div>
<script type="module">
  import { NAME } from "../design/brand.js";
  import { createCtx } from "./_fakectx.js";

  const staticMode = new URLSearchParams(location.search).has("static");
  document.getElementById("hx-name").textContent = NAME;
  const ctx = await createCtx({ staticMode, toastEl: document.getElementById("hx-toast") });
  window.__hx = { ctx };
  const loaders = { match: () => import("./match.js"), sequencer: () => import("./sequencer.js") };
  const meta = document.getElementById("hx-meta");
  const other = staticMode ? location.pathname : `${location.pathname}?static`;
  function paintMeta() {
    meta.replaceChildren(`Harness · ${staticMode ? "static page (no server)" : `app · S-1 ${ctx.status.sync === "offline" ? "not connected, sound from the twin" : ctx.status.sync}`} · `);
    const a = document.createElement("a");
    a.href = other + location.hash;
    a.textContent = staticMode ? "switch to the app" : "switch to the static page";
    meta.append(a);
  }
  ctx.on("status", paintMeta);
  let mounted = null;
  async function route() {
    const name = location.hash.slice(1) || "match";
    const mod = await (loaders[name] || loaders.match)();
    const view = mod.default || mod;
    if (mounted) mounted.unmount();
    const root = document.getElementById("hx-root");
    root.replaceChildren();
    view.mount(root, ctx);
    mounted = view;
    window.__hx.view = view;
    document.querySelectorAll(".hx-nav a").forEach((a) =>
      a.setAttribute("aria-current", a.getAttribute("href") === `#${view.id}` ? "page" : "false"));
    document.title = `${view.title} · harness`;
    paintMeta();
  }
  addEventListener("hashchange", route);
  await route();
  document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
