<!doctype html>
<html lang="en">
<head>
<meta name="twin-static" content="1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>
<meta name="description" content="A software twin of the Roland S-1: play it, watch every stage of the sound, and sync it to a real S-1.">
<link rel="icon" href="design/favicon.svg">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="keyhint/keyhint.css">
<link rel="stylesheet" href="core/app.css">
<script>
  // The page-load exposure (views/synth.js): the plate starts pale, like an undeveloped sun print,
  // unless the page opens on another view or the reader asked for stillness. Runs before first paint.
  (function () {
    var parts = location.hash.replace(/^#/, "").split("&");
    var still = parts.indexOf("still") >= 0 || matchMedia("(prefers-reduced-motion: reduce)").matches;
    var view = ["synth", "sequencer", "match"].indexOf(parts[0]) >= 0 ? parts[0] : "synth";
    if (!still && view === "synth") document.documentElement.classList.add("developing");
  })();
</script>
</head>
<body>
<header class="top">
  <a class="brand" id="brand" href="#synth">
    <!-- The mark (design/mark.svg, drawn in currentColor): the lyrebird's tail in display, read as a lyre whose strings are the S-1's waves. -->
    <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M16 28.6C10.6 28.6 6.8 23.8 6.9 17.2 7 12.4 8.9 9.2 9.6 6.8 10.1 5.1 8.9 3.7 7.5 4.2 6.3 4.6 6.2 6.2 7.4 6.6"/>
      <path d="M16 28.6C21.4 28.6 25.2 23.8 25.1 17.2 25 12.4 23.1 9.2 22.4 6.8 21.9 5.1 23.1 3.7 24.5 4.2 25.7 4.6 25.8 6.2 24.6 6.6"/>
      <path d="M12.8 26c-1-2 1-3.2 0-5.2s1-3.2 0-5.2 1-3.2 0-5.2"/>
      <path d="M16 26.8v-2.2l1.1-2.6H16l1.1-2.6H16l1.1-2.6H16l1.1-2.6H16l1.1-2.6H16v-1.6"/>
      <path d="M19.2 26v-2.9h1v-2.9h-1v-2.9h1v-2.9h-1v-2.9h1"/>
    </svg>
    <span class="wordmark" id="wordmark"></span>
  </a>
  <nav class="views" id="nav" aria-label="Views">
    <a href="#synth" data-view="synth">Synth</a>
    <a href="#sequencer" data-view="sequencer">Sequencer</a>
    <a href="#match" data-view="match">Match</a>
  </nav>
  <div class="actions">
    <button class="quiet" type="button" data-open="library">Library</button>
    <button class="quiet" type="button" data-open="settings">Settings</button>
    <span class="sync" id="sync" role="status"><i class="dot" aria-hidden="true"></i><span id="sync-text">Looking for the S-1</span></span>
    <button class="pill" type="button" id="send">Send patch to S-1</button>
  </div>
</header>
<p class="intro" id="intro" hidden></p>

<main class="view-host" id="view"></main>

<footer class="foot" id="foot"></footer>

<aside class="drawer" id="drawer-library" aria-label="Library" aria-hidden="true" inert></aside>
<aside class="drawer" id="drawer-settings" aria-label="Settings" aria-hidden="true" inert></aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="veil" aria-hidden="true"></div>

<script src="keyhint/keyhint.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
