[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1tui"
version = "0.2.0"
description = "The Roland S-1, fully present in software — web cockpit, live sync, audio monitor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# The match engine's heavy numerics. Install with: pip install -e ".[studio]"
studio = [
    "scipy>=1.10",
    "cma>=3.2",
]
# Tests and linting: pip install -e ".[studio,dev]"
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx",
]

[project.scripts]
s1 = "s1tui.__main__:main"
s1tui-web = "s1tui.__main__:main"
s1tui-match = "s1tui.match.cli:main"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E741",  # single-letter loss variable `l` reads fine in the math code
]
