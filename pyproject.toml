[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth"
version = "0.3.0"
description = "A hardware synth, fully present in software — web cockpit, live sync, sequencer, agent API (backend: Roland S-1)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# The match engine's heavy numerics. Install with: pip install -e ".[studio]"
studio = [
    "scipy>=1.10",
    "cma>=3.2",
]
# The differentiable digital twin (synth/match/twin.py). autograd (HIPS autograd,
# not torch/jax) gives exact gradients through autograd.numpy — including
# autograd.numpy.fft — for the gradient-descent sound match. Install with the
# studio extra: pip install -e ".[studio,twin]"
twin = [
    "autograd>=1.6",
]
# Tests and linting: pip install -e ".[studio,dev]"
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx",
]

[project.scripts]
s1 = "synth.__main__:main"       # the name the README teaches
synth = "synth.__main__:main"
synth-match = "synth.match.cli:main"
synth-prm = "synth.prm_cli:main"
synth-logic = "synth.logic:main"
synth-calibrate = "synth.match.calibrate_cli:main"
synth-eartest-report = "tools.eartest_report:main"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E741",  # single-letter loss variable `l` reads fine in the math code
]
