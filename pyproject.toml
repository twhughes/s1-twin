[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1tui"
version = "0.1.0"
description = "Terminal UI controller for the Roland S-1 synthesizer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "textual>=0.47.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
]

[project.scripts]
s1tui = "s1tui.__main__:main"
